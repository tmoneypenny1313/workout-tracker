    /* 6G. PROGRESS & ANALYTICS DASHBOARD */
    function renderProgressView() {
      const allEx = getAllExercises();
      // Count completed sessions across 12 weeks
      let liftSessionsDone = 0;
      let runSessionsDone = 0;
      let totalRunMiles = 0;
      let totalVolumeAllWeeks = 0;

      for (let w = 1; w <= 12; w++) {
        PROGRAM.days.forEach(d => {
          const comp = getDayCompletion(w, d);
          if (d.type === "lift" && comp.hasAny) liftSessionsDone++;
          if ((d.type === "run" || d.type === "opt") && comp.hasAny) runSessionsDone++;
        });
        allEx.forEach(ex => {
          const rec = state.lifts[`${w}_${ex.id}`];
          if (rec) totalVolumeAllWeeks += calculateExerciseMetrics(ex, rec).volume;
        });
        ["tue", "thu", "sat"].forEach(dId => {
          const r = state.runs[`${w}_${dId}`];
          if (r && r.distance) totalRunMiles += parseFloat(r.distance) || 0;
        });
      }

      // Overload watchlist for current week
      const overloadList = [];
      allEx.forEach(ex => {
        const alert = checkOverloadReady(state.currentWeek, ex);
        if (alert) overloadList.push({ ex, alert });
      });

      const selectedEx = getExerciseById(state.selectedChartLift)?.exercise || allEx[0];

      return `
        <h2 style="margin:4px 0 12px 2px; font-size:20px;">12-Week Progress & Analytics</h2>

        <!-- Summary KPIs -->
        <div class="stats-grid-3" style="margin-bottom:12px;">
          <div class="stat-box">
            <div class="stat-label">Lift Sessions</div>
            <div class="stat-value" style="color:var(--accent);">${liftSessionsDone}<span style="font-size:13px; color:var(--text-muted);">/36</span></div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Runs Logged</div>
            <div class="stat-value" style="color:var(--success);">${runSessionsDone}<span style="font-size:13px; color:var(--text-muted);">/36</span></div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Total Miles</div>
            <div class="stat-value">${Math.round(totalRunMiles * 10) / 10} <span style="font-size:12px;">mi</span></div>
          </div>
        </div>

        <!-- Auto Overload Ready Watchlist -->
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="font-size:13px; font-weight:700; color:var(--success); text-transform:uppercase;">Overload Ready (+2.5–5%)</span>
            <span class="badge badge-success">Week ${state.currentWeek}</span>
          </div>
          ${overloadList.length === 0 ? `
            <p style="margin:0; font-size:13.5px; color:var(--text-secondary);">
              Hit the top of your target rep range on all sets of any exercise to trigger automatic +2.5–5% load recommendations here.
            </p>
          ` : overloadList.map(({ ex, alert }) => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);">
              <div>
                <div style="font-weight:700; font-size:14.5px;">${ex.name}</div>
                <div style="font-size:12.5px; color:var(--text-secondary);">
                  ${alert.suggestedWeight ? `Current: ${alert.currentWeight} lbs → Try <strong>${alert.suggestedWeight} lbs</strong>` : `Hit ${ex.maxReps} reps on all sets!`}
                </div>
              </div>
              <button class="btn-secondary" data-jump-ex="${ex.id}" style="padding:6px 12px; min-height:36px; font-size:12.5px; color:var(--accent);">Open</button>
            </div>
          `).join("")}
        </div>

        <!-- Weekly Total Volume Chart -->
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="font-size:13px; font-weight:700; color:var(--text-secondary); text-transform:uppercase;">Weekly Lifting Volume (lbs)</span>
            <span style="font-size:12px; color:var(--accent); font-weight:700;">Total: ${totalVolumeAllWeeks.toLocaleString()} lbs</span>
          </div>
          <canvas id="weeklyVolumeCanvas" class="chart-canvas"></canvas>
        </div>

        <!-- Individual Lift e1RM & Top Weight Progression -->
        <div class="card">
          <div style="font-size:13px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; margin-bottom:8px;">
            Lift Progression (e1RM & Top Weight)
          </div>
          <select id="liftProgressSelect" style="margin-bottom:12px;">
            ${allEx.filter(e => e.inputMode !== "timed").map(e => `
              <option value="${e.id}" ${e.id === selectedEx.id ? "selected" : ""}>${e.dayName}: ${e.name}</option>
            `).join("")}
          </select>
          <canvas id="liftProgressCanvas" class="chart-canvas"></canvas>
          <div style="display:flex; justify-content:center; gap:16px; margin-top:8px; font-size:12px; color:var(--text-secondary);">
            <span><strong style="color:#38bdf8;">●</strong> Est. 1RM (lbs)</span>
            <span><strong style="color:#10b981;">●</strong> Top Set Weight / Reps</span>
          </div>
        </div>
      `;
    }

    function attachProgressEvents() {
      document.querySelectorAll("[data-jump-ex]").forEach(btn => {
        btn.addEventListener("click", () => openLift(btn.dataset.jumpEx));
      });

      const sel = document.getElementById("liftProgressSelect");
      if (sel) {
        sel.addEventListener("change", () => {
          state.selectedChartLift = sel.value;
          saveState();
          drawLiftProgressChart();
        });
      }

      drawWeeklyVolumeChart();
      drawLiftProgressChart();
    }

    /* 6H. DATA EXPORT & BACKUP VIEW (GOOGLE SHEETS CSV + JSON) */
    function renderDataView() {
      return `
        <h2 style="margin:4px 0 12px 2px; font-size:20px;">Export & Backup</h2>

        <div class="card">
          <div style="font-size:13px; font-weight:700; color:var(--accent); text-transform:uppercase; margin-bottom:4px;">Google Sheets Sync</div>
          <h3 style="margin:0 0 8px 0; font-size:17px;">Export CSV for Google Sheets</h3>
          <p style="margin:0 0 14px 0; font-size:13.5px; color:var(--text-secondary);">
            Downloads CSV files formatted to match your original 12-Week Weight Training spreadsheet columns so you can import or archive them directly in Google Drive.
          </p>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <button type="button" class="btn-primary" id="exportLiftsCsvBtn">Download Weight Training Log (.csv)</button>
            <button type="button" class="btn-secondary" id="exportRunsCsvBtn">Download Running Log (.csv)</button>
            <button type="button" class="btn-secondary" id="exportBodyCsvBtn">Download Body Measurements (.csv)</button>
          </div>
        </div>

        <div class="card">
          <div style="font-size:13px; font-weight:700; color:var(--success); text-transform:uppercase; margin-bottom:4px;">iOS Safari Data Safety</div>
          <h3 style="margin:0 0 8px 0; font-size:17px;">Full JSON Backup & Restore</h3>
          <p style="margin:0 0 14px 0; font-size:13.5px; color:var(--text-secondary);">
            Save a complete backup file to your iPhone Files / iCloud Drive, or restore from a previous backup.
          </p>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <button type="button" class="btn-secondary" id="exportJsonBtn" style="color:var(--success); border-color:rgba(16,185,129,0.45);">Download Full Backup (.json)</button>
            <label class="btn-secondary" style="cursor:pointer;">
              <span>Restore from Backup (.json)</span>
              <input type="file" id="importJsonInput" accept=".json,application/json" style="display:none;" />
            </label>
          </div>
        </div>

        <div class="card" style="border-color:rgba(239,68,68,0.35);">
          <h3 style="margin:0 0 8px 0; font-size:16px; color:#fca5a5;">Reset Data</h3>
          <p style="margin:0 0 12px 0; font-size:13px; color:var(--text-secondary);">
            Clear all logged lifts, runs, and body measurements from this device.
          </p>
          <button type="button" class="btn-secondary" id="resetAllBtn" style="width:100%; color:#f87171; border-color:rgba(239,68,68,0.45);">
            Reset All App Data
          </button>
        </div>
      `;
    }

    function attachDataEvents() {
      document.getElementById("exportLiftsCsvBtn").addEventListener("click", exportLiftsCSV);
      document.getElementById("exportRunsCsvBtn").addEventListener("click", exportRunsCSV);
      document.getElementById("exportBodyCsvBtn").addEventListener("click", exportBodyCSV);
      document.getElementById("exportJsonBtn").addEventListener("click", exportFullJSON);

      document.getElementById("importJsonInput").addEventListener("change", e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (!parsed || typeof parsed !== "object" || !parsed.lifts) {
              throw new Error("Invalid backup file");
            }
            state = { ...createEmptyState(), ...parsed };
            saveState("Backup restored!");
            render();
          } catch (err) {
            showToast("Invalid JSON backup file.");
          }
        };
        reader.readAsText(file);
      });

      document.getElementById("resetAllBtn").addEventListener("click", () => {
        openConfirmModal(
          "Reset All Data?",
          "This will permanently erase all 12 weeks of logged lifts, runs, recovery notes, and body measurements on this device. Make sure you download a backup first.",
          () => {
            state = createEmptyState();
            saveState("All data cleared.");
            switchTab("calendar");
          }
        );
      });
    }

    /*************************************************************************
     * 7. RESPONSIVE HTML5 CANVAS CHARTS
     *************************************************************************/
    function setupCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return null;
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const width = rect.width || 340;
      const height = 210;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      return { ctx, width, height };
    }

    function drawLineChart(canvasId, seriesList, unitSuffix = "") {
      const setup = setupCanvas(canvasId);
      if (!setup) return;
      const { ctx, width, height } = setup;

      const pad = { top: 20, right: 16, bottom: 28, left: 46 };
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;

      ctx.clearRect(0, 0, width, height);

      // Collect all numeric points
      const allVals = [];
      seriesList.forEach(s => s.data.forEach(v => { if (v !== null && !isNaN(v)) allVals.push(v); }));

      // Draw horizontal gridlines & Week 1-12 X labels
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#94a3b8";
      ctx.font = "11px -apple-system, sans-serif";
      ctx.textAlign = "center";

      for (let w = 1; w <= 12; w++) {
        const x = pad.left + ((w - 1) / 11) * plotW;
        ctx.fillText(`W${w}`, x, height - 8);
      }

      if (allVals.length === 0) {
        ctx.fillStyle = "#64748b";
        ctx.font = "13px -apple-system, sans-serif";
        ctx.fillText("Log workouts across weeks to view trend chart", width / 2, height / 2);
        return;
      }

      let minVal = Math.min(...allVals);
      let maxVal = Math.max(...allVals);
      if (minVal === maxVal) {
        minVal = Math.max(0, minVal * 0.9);
        maxVal = maxVal * 1.1 || 10;
      } else {
        const margin = (maxVal - minVal) * 0.15;
        minVal = Math.max(0, minVal - margin);
        maxVal = maxVal + margin;
      }

      ctx.textAlign = "right";
      for (let i = 0; i <= 3; i++) {
        const ratio = i / 3;
        const y = pad.top + plotH - ratio * plotH;
        const val = minVal + ratio * (maxVal - minVal);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(width - pad.right, y);
        ctx.stroke();
        ctx.fillText(`${Math.round(val * 10) / 10}`, pad.left - 6, y + 4);
      }

      // Draw each series
      seriesList.forEach(s => {
        ctx.strokeStyle = s.color;
        ctx.fillStyle = s.color;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        let started = false;
        const pts = [];

        s.data.forEach((val, idx) => {
          if (val === null || isNaN(val)) return;
          const x = pad.left + (idx / 11) * plotW;
          const y = pad.top + plotH - ((val - minVal) / (maxVal - minVal)) * plotH;
          pts.push({ x, y, val });
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        });
        ctx.stroke();

        pts.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fill();
        });
      });
    }

    function drawWeeklyVolumeChart() {
      const allEx = getAllExercises();
      const weeklyVols = [];
      for (let w = 1; w <= 12; w++) {
        let sum = 0;
        allEx.forEach(ex => {
          const rec = state.lifts[`${w}_${ex.id}`];
          if (rec) sum += calculateExerciseMetrics(ex, rec).volume;
        });
        weeklyVols.push(sum > 0 ? sum : null);
      }
      drawLineChart("weeklyVolumeCanvas", [{ color: "#38bdf8", data: weeklyVols }]);
    }

    function drawLiftProgressChart() {
      const found = getExerciseById(state.selectedChartLift);
      if (!found) return;
      const ex = found.exercise;
      const e1rmSeries = [];
      const topSeries = [];

      for (let w = 1; w <= 12; w++) {
        const rec = state.lifts[`${w}_${ex.id}`];
        if (!rec) {
          e1rmSeries.push(null);
          topSeries.push(null);
          continue;
        }
        const m = calculateExerciseMetrics(ex, rec);
        if (ex.inputMode === "weighted") {
          e1rmSeries.push(m.bestE1RM > 0 ? m.bestE1RM : null);
          topSeries.push(m.topWeight > 0 ? m.topWeight : null);
        } else {
          e1rmSeries.push(null);
          topSeries.push(m.totalReps > 0 ? m.totalReps : null);
        }
      }

      drawLineChart("liftProgressCanvas", [
        { color: "#38bdf8", data: e1rmSeries },
        { color: "#10b981", data: topSeries }
      ]);
    }

    function drawBodyChart() {
      const metric = state.selectedBodyMetric || "weight";
      const vals = [];
      for (let w = 1; w <= 12; w++) {
        const b = state.body[`${w}`];
        const v = b && b[metric] !== "" ? parseFloat(b[metric]) : null;
        vals.push(v && !isNaN(v) ? v : null);
      }
      drawLineChart("bodyChartCanvas", [{ color: "#38bdf8", data: vals }]);
    }

    /*************************************************************************
     * 8. CSV & JSON EXPORT HELPERS
     *************************************************************************/
    function triggerDownload(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function csvEscape(val) {
      const str = val === null || val === undefined ? "" : String(val);
      if (str.includes(",") || str.includes('"') || str.includes("\n")) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    }

    function exportLiftsCSV() {
      const headers = [
        "Day", "Week", "Exercise", "Sets", "Target reps / time",
        "Set 1 wt", "Set 1 reps", "Set 2 wt", "Set 2 reps",
        "Set 3 wt", "Set 3 reps", "Set 4 wt", "Set 4 reps",
        "Volume Load (lbs)", "Est 1RM (lbs)", "Notes"
      ];
      const rows = [headers.join(",")];

      PROGRAM.days.filter(d => d.type === "lift").forEach(day => {
        for (let w = 1; w <= 12; w++) {
          day.exercises.forEach(ex => {
            const rec = getLiftRecord(w, ex);
            const metrics = calculateExerciseMetrics(ex, rec);
            const s = rec.sets;
            const row = [
              day.dayName,
              w,
              ex.name,
              ex.sets,
              ex.target,
              s[0]?.weight ?? "", s[0]?.reps ?? "",
              s[1]?.weight ?? "", s[1]?.reps ?? "",
              s[2]?.weight ?? "", s[2]?.reps ?? "",
              s[3]?.weight ?? "", s[3]?.reps ?? "",
              metrics.volume || "",
              metrics.bestE1RM || "",
              rec.notes || ""
            ].map(csvEscape);
            rows.push(row.join(","));
          });
        }
      });

      triggerDownload("12_Week_Weight_Training_Lifts.csv", rows.join("\n"), "text/csv;charset=utf-8;");
      showToast("Lifts CSV downloaded!");
    }

    function exportRunsCSV() {
      const headers = ["Week", "Day", "Planned Type", "Date", "Duration (min)", "Distance (mi)", "Pace", "Effort (1-10)", "Notes"];
      const rows = [headers.join(",")];

      for (let w = 1; w <= 12; w++) {
        ["tue", "thu", "sat"].forEach(dId => {
          const day = getDayById(dId);
          const r = state.runs[`${w}_${dId}`] || {};
          rows.push([
            w,
            day.dayName,
            day.plannedType,
            r.date || "",
            r.duration || "",
            r.distance || "",
            computePace(r.duration, r.distance),
            r.effort || "",
            r.notes || ""
          ].map(csvEscape).join(","));
        });
      }

      triggerDownload("12_Week_Running_Log.csv", rows.join("\n"), "text/csv;charset=utf-8;");
      showToast("Running CSV downloaded!");
    }

    function exportBodyCSV() {
      const headers = ["Week", "Date", "Body Weight (lbs)", "Body Fat (%)", "Waist (in)", "Chest (in)", "Arms (in)", "Thighs (in)", "Notes"];
      const rows = [headers.join(",")];

      for (let w = 1; w <= 12; w++) {
        const b = state.body[`${w}`] || {};
        rows.push([
          w,
          b.date || "",
          b.weight || "",
          b.bodyFat || "",
          b.waist || "",
          b.chest || "",
          b.arms || "",
          b.thighs || "",
          b.notes || ""
        ].map(csvEscape).join(","));
      }

      triggerDownload("12_Week_Body_Measurements.csv", rows.join("\n"), "text/csv;charset=utf-8;");
      showToast("Measurements CSV downloaded!");
    }

    function exportFullJSON() {
      const payload = JSON.stringify(state, null, 2);
      triggerDownload(`12_Week_Strength_Backup_${new Date().toISOString().slice(0,10)}.json`, payload, "application/json");
      showToast("Full JSON backup saved!");
    }

    /*************************************************************************
     * 9. MODAL & SANITIZATION HELPERS
     *************************************************************************/
    let pendingModalAction = null;

    function openConfirmModal(title, message, onConfirm) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalMessage").textContent = message;
      pendingModalAction = onConfirm;
      document.getElementById("confirmModal").classList.remove("hidden");
    }

    function closeConfirmModal() {
      document.getElementById("confirmModal").classList.add("hidden");
      pendingModalAction = null;
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    /*************************************************************************
     * 10. INITIALIZATION
     *************************************************************************/
    document.getElementById("prevWeekBtn").addEventListener("click", () => setWeek(state.currentWeek - 1));
    document.getElementById("nextWeekBtn").addEventListener("click", () => setWeek(state.currentWeek + 1));

    document.querySelectorAll(".nav-tab").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    document.getElementById("modalCancelBtn").addEventListener("click", closeConfirmModal);
    document.getElementById("modalConfirmBtn").addEventListener("click", () => {
      if (pendingModalAction) pendingModalAction();
      closeConfirmModal();
    });

    window.addEventListener("resize", () => {
      if (state.view === "body") drawBodyChart();
      if (state.view === "progress") {
        drawWeeklyVolumeChart();
        drawLiftProgressChart();
      }
    });

    // Initial render
    render();
  </script>
